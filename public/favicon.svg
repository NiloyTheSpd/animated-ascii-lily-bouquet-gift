<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">ASCII lily bouquet</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.36" r="0.8" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#33143a"/>
      <stop offset="42%" stop-color="#180a1b"/>
      <stop offset="100%" stop-color="#07040a"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.44" r="0.5" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#ff86b4" stop-opacity="0.34"/>
      <stop offset="62%" stop-color="#c8306e" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#c8306e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalOut" x1="0.5" y1="1" x2="0.5" y2="0" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#8e1028"/>
      <stop offset="38%" stop-color="#d01a44"/>
      <stop offset="74%" stop-color="#ef6b93"/>
      <stop offset="100%" stop-color="#fbc0d6"/>
    </linearGradient>
    <linearGradient id="petalIn" x1="0.5" y1="1" x2="0.5" y2="0" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#b01536"/>
      <stop offset="44%" stop-color="#e8426e"/>
      <stop offset="80%" stop-color="#f89cba"/>
      <stop offset="100%" stop-color="#fdd9e5"/>
    </linearGradient>
    <radialGradient id="core" cx="0.42" cy="0.34" r="0.72" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#cde284"/>
      <stop offset="48%" stop-color="#9dbd46"/>
      <stop offset="100%" stop-color="#5d7a1e"/>
    </radialGradient>

    <!-- petal shapes (reused as clip targets) -->
    <path id="shapeBack" d="M0 0 C -7.5 -6, -8.5 -17, 0 -27 C 8.5 -17, 7.5 -6, 0 0 Z"/>
    <path id="shapeFront" d="M0 0 C -6.5 -5, -7.5 -14, 0 -22 C 7.5 -14, 6.5 -5, 0 0 Z"/>

    <clipPath id="clipBack"><use href="#shapeBack"/></clipPath>
    <clipPath id="clipFront"><use href="#shapeFront"/></clipPath>

    <!-- a petal + its clipped detail, one unit per rotation -->
    <g id="petalBack">
      <use href="#shapeBack" fill="url(#petalOut)"/>
      <g clip-path="url(#clipBack)">
        <path d="M0 -3 L0 -20" stroke="#4e120f" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.4"/>
        <g fill="#7d1020" opacity="0.6">
          <circle cx="-1.7" cy="-8" r="0.85"/><circle cx="1.9" cy="-10.5" r="0.7"/>
          <circle cx="0.5" cy="-13" r="0.65"/><circle cx="-2.3" cy="-12" r="0.6"/>
          <circle cx="-3.6" cy="-8.5" r="0.65"/><circle cx="3.4" cy="-8" r="0.7"/>
          <circle cx="3" cy="-12.5" r="0.55"/><circle cx="-1.3" cy="-16" r="0.55"/>
          <circle cx="2.1" cy="-15.5" r="0.55"/>
        </g>
      </g>
    </g>

    <g id="petalFront">
      <use href="#shapeFront" fill="url(#petalIn)"/>
      <g clip-path="url(#clipFront)">
        <path d="M0 -3 L0 -16" stroke="#4e120f" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.4"/>
        <g fill="#7d1020" opacity="0.6">
          <circle cx="-1.5" cy="-7" r="0.8"/><circle cx="1.7" cy="-9.5" r="0.65"/>
          <circle cx="0.4" cy="-12" r="0.6"/><circle cx="-2" cy="-11" r="0.55"/>
          <circle cx="-3" cy="-7.5" r="0.6"/><circle cx="2.9" cy="-7" r="0.6"/>
          <circle cx="2.6" cy="-11.5" r="0.5"/><circle cx="-1.1" cy="-14" r="0.5"/>
        </g>
      </g>
    </g>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="31" r="27" fill="url(#halo)"/>

  <!-- starfield -->
  <g fill="#fff3f8">
    <circle cx="9" cy="12" r="0.85" opacity="0.8"/>
    <circle cx="55" cy="10" r="1" opacity="0.85"/>
    <circle cx="7" cy="40" r="0.65" opacity="0.55"/>
    <circle cx="57" cy="36" r="0.75" opacity="0.65"/>
    <circle cx="52" cy="54" r="0.6" opacity="0.45"/>
    <circle cx="13" cy="55" r="0.65" opacity="0.5"/>
    <circle cx="31" cy="7" r="0.55" opacity="0.45"/>
  </g>
  <g stroke="#ffd3e0" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <path d="M17 8 L17 12 M15 10 L19 10"/>
    <path d="M50 50 L50 54 M48 52 L52 52"/>
  </g>

  <!-- ============ SIX PETALS, radial from center (32,31) ============ -->
  <g transform="translate(32 31)">
    <use href="#petalBack" transform="rotate(0)"/>
    <use href="#petalBack" transform="rotate(120)"/>
    <use href="#petalBack" transform="rotate(240)"/>
    <use href="#petalFront" transform="rotate(60)"/>
    <use href="#petalFront" transform="rotate(180)"/>
    <use href="#petalFront" transform="rotate(300)"/>
  </g>

  <!-- stamens tucked inside the throat -->
  <g transform="translate(32 31)">
    <g stroke="#f5e2a0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M0 0 C -0.8 -2.6, -2 -4.6, -3.4 -6.4"/>
      <path d="M0 0 C 0.8 -2.6, 2 -4.6, 3.4 -6.4"/>
    </g>
    <g>
      <ellipse cx="-3.7" cy="-6.8" rx="1.45" ry="1.05" fill="#6b2b1a"/>
      <ellipse cx="3.7" cy="-6.8" rx="1.45" ry="1.05" fill="#6b2b1a"/>
      <ellipse cx="-3.95" cy="-7.05" rx="0.72" ry="0.55" fill="#d99a63"/>
      <ellipse cx="3.45" cy="-7.05" rx="0.72" ry="0.55" fill="#d99a63"/>
    </g>
  </g>

  <!-- center: small green throat -->
  <g transform="translate(32 31)">
    <circle cx="0" cy="0" r="2.4" fill="url(#core)"/>
    <circle cx="-0.7" cy="-0.8" r="0.65" fill="#e6f3b8" opacity="0.85"/>
  </g>

  <!-- ASCII glyph overlay: the app's signature texture -->
  <g font-family="'Courier New', Courier, monospace" font-weight="700" fill="#ffffff" opacity="0.92">
    <text x="6" y="15" font-size="7">@</text>
    <text x="49" y="12" font-size="6">#</text>
    <text x="6" y="46" font-size="6">+</text>
    <text x="50" y="45" font-size="6.5">@</text>
    <text x="27" y="60" font-size="5">=</text>
    <text x="45" y="59" font-size="5">-</text>
  </g>
</svg>
