<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">I love you Bushra my jaan</title>
  <desc id="og-desc">A bouquet of ASCII lilies blooming under a starry night sky.</desc>
  <defs>
    <radialGradient id="sky" cx="0.62" cy="0.46" r="0.82" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#3a1642"/>
      <stop offset="34%" stop-color="#1d0b22"/>
      <stop offset="72%" stop-color="#0d0510"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <radialGradient id="nebulaA" cx="0.16" cy="0.28" r="0.44" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#9c3c78" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#9c3c78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.86" cy="0.1" r="0.4" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#6036a0" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#6036a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomGlow" cx="0.5" cy="0.46" r="0.5" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#ff7fb0" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#c8306e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c8306e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalOut" x1="0.5" y1="1" x2="0.5" y2="0" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#8e1028"/>
      <stop offset="40%" stop-color="#d01a44"/>
      <stop offset="76%" stop-color="#ef6b93"/>
      <stop offset="100%" stop-color="#fbc0d6"/>
    </linearGradient>
    <linearGradient id="petalIn" x1="0.5" y1="1" x2="0.5" y2="0" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#b01536"/>
      <stop offset="46%" stop-color="#e8426e"/>
      <stop offset="82%" stop-color="#f89cba"/>
      <stop offset="100%" stop-color="#fdd9e5"/>
    </linearGradient>
    <linearGradient id="petalCream" x1="0.5" y1="1" x2="0.5" y2="0" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#c9b58c"/>
      <stop offset="44%" stop-color="#eee0c4"/>
      <stop offset="82%" stop-color="#f8f1e0"/>
      <stop offset="100%" stop-color="#fffdf6"/>
    </linearGradient>
    <radialGradient id="core" cx="0.42" cy="0.34" r="0.72" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#cde284"/>
      <stop offset="48%" stop-color="#9dbd46"/>
      <stop offset="100%" stop-color="#5d7a1e"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#4f8f45"/>
      <stop offset="100%" stop-color="#204c2d"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0.5" y1="0" x2="0.5" y2="1" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#c9ab7c"/>
      <stop offset="55%" stop-color="#b0915f"/>
      <stop offset="100%" stop-color="#8d7047"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#e0507a"/>
      <stop offset="100%" stop-color="#a8183c"/>
    </linearGradient>

    <path id="shapeBack" d="M0 0 C -7.5 -6, -8.5 -17, 0 -27 C 8.5 -17, 7.5 -6, 0 0 Z"/>
    <path id="shapeFront" d="M0 0 C -6.5 -5, -7.5 -14, 0 -22 C 7.5 -14, 6.5 -5, 0 0 Z"/>
    <clipPath id="clipBack"><use href="#shapeBack"/></clipPath>
    <clipPath id="clipFront"><use href="#shapeFront"/></clipPath>

    <g id="petalBack">
      <use href="#shapeBack" fill="url(#petalOut)"/>
      <g clip-path="url(#clipBack)">
        <path d="M0 -3 L0 -20" stroke="#4e120f" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.38"/>
        <g fill="#7d1020" opacity="0.55">
          <circle cx="-1.7" cy="-8" r="0.85"/><circle cx="1.9" cy="-10.5" r="0.7"/>
          <circle cx="0.5" cy="-13" r="0.65"/><circle cx="-2.3" cy="-12" r="0.6"/>
          <circle cx="-3.6" cy="-8.5" r="0.65"/><circle cx="3.4" cy="-8" r="0.7"/>
          <circle cx="3" cy="-12.5" r="0.55"/><circle cx="-1.3" cy="-16" r="0.55"/>
        </g>
      </g>
    </g>
    <g id="petalFront">
      <use href="#shapeFront" fill="url(#petalIn)"/>
      <g clip-path="url(#clipFront)">
        <path d="M0 -3 L0 -16" stroke="#4e120f" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.38"/>
        <g fill="#7d1020" opacity="0.55">
          <circle cx="-1.5" cy="-7" r="0.8"/><circle cx="1.7" cy="-9.5" r="0.65"/>
          <circle cx="0.4" cy="-12" r="0.6"/><circle cx="-2" cy="-11" r="0.55"/>
          <circle cx="-3" cy="-7.5" r="0.6"/><circle cx="2.9" cy="-7" r="0.6"/>
        </g>
      </g>
    </g>
    <g id="petalCreamBack">
      <use href="#shapeBack" fill="url(#petalCream)"/>
      <g clip-path="url(#clipBack)">
        <path d="M0 -3 L0 -20" stroke="#8a7346" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.35"/>
        <g fill="#a78d5c" opacity="0.5">
          <circle cx="-1.7" cy="-8" r="0.85"/><circle cx="1.9" cy="-10.5" r="0.7"/>
          <circle cx="0.5" cy="-13" r="0.65"/><circle cx="-3.6" cy="-8.5" r="0.65"/>
        </g>
      </g>
    </g>
    <g id="petalCreamFront">
      <use href="#shapeFront" fill="url(#petalCream)"/>
      <g clip-path="url(#clipFront)">
        <path d="M0 -3 L0 -16" stroke="#8a7346" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.35"/>
        <g fill="#a78d5c" opacity="0.5">
          <circle cx="-1.5" cy="-7" r="0.8"/><circle cx="1.7" cy="-9.5" r="0.65"/>
          <circle cx="-3" cy="-7.5" r="0.6"/>
        </g>
      </g>
    </g>

    <g id="bloom">
      <use href="#petalBack" transform="rotate(0)"/>
      <use href="#petalBack" transform="rotate(120)"/>
      <use href="#petalBack" transform="rotate(240)"/>
      <use href="#petalFront" transform="rotate(60)"/>
      <use href="#petalFront" transform="rotate(180)"/>
      <use href="#petalFront" transform="rotate(300)"/>
      <g stroke="#f5e2a0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M0 0 C -0.8 -2.6, -2 -4.6, -3.4 -6.4"/>
        <path d="M0 0 C 0.8 -2.6, 2 -4.6, 3.4 -6.4"/>
      </g>
      <ellipse cx="-3.7" cy="-6.8" rx="1.45" ry="1.05" fill="#6b2b1a"/>
      <ellipse cx="3.7" cy="-6.8" rx="1.45" ry="1.05" fill="#6b2b1a"/>
      <circle cx="0" cy="0" r="2.4" fill="url(#core)"/>
      <circle cx="-0.7" cy="-0.8" r="0.65" fill="#e6f3b8" opacity="0.85"/>
    </g>
    <g id="bloomCream">
      <use href="#petalCreamBack" transform="rotate(0)"/>
      <use href="#petalCreamBack" transform="rotate(120)"/>
      <use href="#petalCreamBack" transform="rotate(240)"/>
      <use href="#petalCreamFront" transform="rotate(60)"/>
      <use href="#petalCreamFront" transform="rotate(180)"/>
      <use href="#petalCreamFront" transform="rotate(300)"/>
      <g stroke="#f5e2a0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M0 0 C -0.8 -2.6, -2 -4.6, -3.4 -6.4"/>
        <path d="M0 0 C 0.8 -2.6, 2 -4.6, 3.4 -6.4"/>
      </g>
      <ellipse cx="-3.7" cy="-6.8" rx="1.45" ry="1.05" fill="#6b2b1a"/>
      <ellipse cx="3.7" cy="-6.8" rx="1.45" ry="1.05" fill="#6b2b1a"/>
      <circle cx="0" cy="0" r="2.4" fill="url(#core)"/>
      <circle cx="-0.7" cy="-0.8" r="0.65" fill="#e6f3b8" opacity="0.85"/>
    </g>

    <!-- leaf pointing up-left from origin -->
    <g id="leaf">
      <path d="M0 0 C -14 -14, -26 -34, -22 -54 C -4 -46, 6 -22, 0 0 Z" fill="#2f6b39"/>
      <path d="M0 0 C -12 -18, -18 -36, -20 -50" stroke="#1e4a2a" stroke-width="1.6" fill="none" opacity="0.65"/>
    </g>
  </defs>

  <!-- ======== background ======== -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#nebulaA)"/>
  <rect width="1200" height="630" fill="url(#nebulaB)"/>

  <!-- starfield -->
  <g fill="#fff3f8">
    <circle cx="72" cy="58" r="1.6" opacity="0.75"/><circle cx="148" cy="122" r="1.1" opacity="0.5"/>
    <circle cx="228" cy="48" r="1.4" opacity="0.7"/><circle cx="310" cy="96" r="1" opacity="0.45"/>
    <circle cx="392" cy="42" r="1.3" opacity="0.6"/><circle cx="470" cy="78" r="0.9" opacity="0.4"/>
    <circle cx="545" cy="38" r="1.5" opacity="0.7"/><circle cx="628" cy="104" r="1" opacity="0.45"/>
    <circle cx="706" cy="56" r="1.2" opacity="0.6"/><circle cx="792" cy="118" r="0.9" opacity="0.4"/>
    <circle cx="878" cy="46" r="1.4" opacity="0.65"/><circle cx="958" cy="96" r="1.1" opacity="0.5"/>
    <circle cx="1044" cy="52" r="1.3" opacity="0.6"/><circle cx="1128" cy="112" r="1" opacity="0.45"/>
    <circle cx="58" cy="288" r="1.1" opacity="0.5"/><circle cx="116" cy="386" r="0.9" opacity="0.4"/>
    <circle cx="1092" cy="272" r="1.2" opacity="0.55"/><circle cx="1146" cy="402" r="0.9" opacity="0.4"/>
    <circle cx="104" cy="520" r="1" opacity="0.4"/><circle cx="1104" cy="536" r="1.1" opacity="0.45"/>
    <circle cx="486" cy="128" r="0.9" opacity="0.35"/><circle cx="700" cy="140" r="0.85" opacity="0.3"/>
    <circle cx="268" cy="176" r="0.8" opacity="0.3"/><circle cx="946" cy="186" r="0.85" opacity="0.3"/>
    <circle cx="700" cy="96" r="0.8" opacity="0.28"/><circle cx="520" cy="106" r="0.75" opacity="0.26"/>
  </g>

  <!-- heart made of stars, upper right -->
  <g>
    <g stroke="#ffd3e0" stroke-width="1.1" fill="none" opacity="0.28">
      <path d="M996 128 C 968 92, 1014 64, 1036 94 C 1058 64, 1104 92, 1076 128 C 1062 146, 1050 160, 1036 172 C 1022 160, 1010 146, 996 128 Z"/>
    </g>
    <g fill="#fff3f8">
      <circle cx="996" cy="128" r="2.5"/><circle cx="986" cy="106" r="2"/>
      <circle cx="1008" cy="90" r="2.2"/><circle cx="1036" cy="94" r="2.7"/>
      <circle cx="1064" cy="90" r="2.2"/><circle cx="1086" cy="106" r="2"/>
      <circle cx="1076" cy="128" r="2.5"/><circle cx="1064" cy="150" r="2"/>
      <circle cx="1050" cy="164" r="1.9"/><circle cx="1036" cy="172" r="2.3"/>
      <circle cx="1022" cy="164" r="1.9"/><circle cx="1008" cy="150" r="2"/>
    </g>
  </g>

  <!-- ======== title, top-left ======== -->
  <g>
    <text x="76" y="118" font-family="'Liberation Serif', Georgia, serif" font-size="46" font-weight="700" letter-spacing="7" fill="#fff5f8" opacity="0.97">I LOVE YOU</text>
    <text x="76" y="182" font-family="'Liberation Serif', Georgia, serif" font-size="58" font-weight="700" letter-spacing="3" fill="#ffc7dc" opacity="0.98">BUSHRA</text>
    <text x="76" y="238" font-family="'Liberation Serif', Georgia, serif" font-size="40" font-weight="400" font-style="italic" letter-spacing="2" fill="#f6a8c6" opacity="0.9">my jaan</text>
    <text x="78" y="282" font-family="'Liberation Mono', monospace" font-size="14" letter-spacing="5" fill="#e9b8cc" opacity="0.55">A BOUQUET OF ASCII LILIES</text>
    <rect x="76" y="298" width="86" height="2" fill="#ff8fb8" opacity="0.5"/>
  </g>

  <!-- ======== bouquet, right side ======== -->
  <ellipse cx="800" cy="300" rx="270" ry="235" fill="url(#bloomGlow)"/>

  <!-- stems fanning down to the tie -->
  <g fill="none" stroke="url(#stemGrad)" stroke-linecap="round">
    <path d="M790 452 C 762 386, 700 340, 655 250" stroke-width="11" opacity="0.9"/>
    <path d="M790 452 C 818 386, 880 340, 925 250" stroke-width="11" opacity="0.9"/>
    <path d="M790 452 C 790 410, 790 320, 790 208" stroke-width="12" opacity="0.95"/>
    <path d="M790 452 C 776 388, 725 330, 680 272" stroke-width="10" opacity="0.82"/>
    <path d="M790 452 C 804 388, 855 330, 900 272" stroke-width="10" opacity="0.82"/>
    <path d="M790 452 C 790 380, 770 292, 736 225" stroke-width="10" opacity="0.82"/>
    <path d="M790 452 C 790 380, 810 292, 844 225" stroke-width="10" opacity="0.82"/>
    <path d="M790 452 C 778 396, 722 358, 668 318" stroke-width="9" opacity="0.74"/>
    <path d="M790 452 C 802 396, 858 358, 912 318" stroke-width="9" opacity="0.74"/>
    <path d="M790 452 C 786 392, 760 320, 706 232" stroke-width="8" opacity="0.66"/>
    <path d="M790 452 C 794 392, 820 320, 874 232" stroke-width="8" opacity="0.66"/>
  </g>

  <!-- foliage: leaves on stems, drawn behind blooms -->
  <g opacity="0.95">
    <use href="#leaf" transform="translate(716 424) rotate(-16) scale(1.25)"/>
    <use href="#leaf" transform="translate(880 430) rotate(14) scale(1.05)"/>
    <use href="#leaf" transform="translate(756 402) rotate(-42) scale(1.0)"/>
    <use href="#leaf" transform="translate(824 402) rotate(42) scale(1.0)"/>
    <use href="#leaf" transform="translate(790 396) rotate(-68) scale(0.88)"/>
    <use href="#leaf" transform="translate(790 396) rotate(68) scale(0.88)"/>
    <use href="#leaf" transform="translate(722 362) rotate(-60) scale(0.8)"/>
    <use href="#leaf" transform="translate(858 362) rotate(60) scale(0.8)"/>
  </g>

  <!-- blooms, back to front, forming a tight dome -->
  <g transform="translate(646 278) scale(1.24)"><use href="#bloom"/></g>
  <g transform="translate(934 278) scale(1.24)"><use href="#bloom"/></g>
  <g transform="translate(790 214) scale(1.4)"><use href="#bloomCream"/></g>
  <g transform="translate(678 298) scale(1.22)"><use href="#bloom"/></g>
  <g transform="translate(902 298) scale(1.22)"><use href="#bloom"/></g>
  <g transform="translate(694 248) scale(1.06)"><use href="#bloomCream"/></g>
  <g transform="translate(886 248) scale(1.06)"><use href="#bloomCream"/></g>
  <g transform="translate(738 232) scale(1.0)"><use href="#bloom"/></g>
  <g transform="translate(842 232) scale(1.0)"><use href="#bloom"/></g>
  <g transform="translate(790 266) scale(1.16)"><use href="#bloom"/></g>
  <g transform="translate(726 300) scale(1.0)"><use href="#bloomCream"/></g>
  <g transform="translate(854 300) scale(1.0)"><use href="#bloomCream"/></g>
  <g transform="translate(678 330) scale(1.06)"><use href="#bloomCream"/></g>
  <g transform="translate(902 330) scale(1.06)"><use href="#bloomCream"/></g>
  <g transform="translate(718 356) scale(1.3)"><use href="#bloom"/></g>
  <g transform="translate(862 356) scale(1.3)"><use href="#bloom"/></g>
  <g transform="translate(790 308) scale(1.54)"><use href="#bloom"/></g>

  <!-- kraft paper wrap: a gathered cone, not a plain triangle -->
  <g>
    <path d="M790 452 C 760 464, 734 492, 722 524 C 732 536, 740 530, 750 538 C 760 546, 766 534, 776 542 C 786 550, 794 536, 804 542 C 816 548, 822 532, 832 538 C 842 544, 848 528, 858 524 C 846 492, 820 464, 790 452 Z" fill="url(#paperGrad)"/>
    <path d="M790 452 C 762 464, 736 492, 726 528" fill="none" stroke="#7d6139" stroke-width="2.4" opacity="0.5"/>
    <path d="M790 452 C 818 464, 844 492, 854 528" fill="none" stroke="#7d6139" stroke-width="2.4" opacity="0.5"/>
    <path d="M722 524 C 732 536, 740 530, 750 538 C 760 546, 766 534, 776 542 C 786 550, 794 536, 804 542 C 816 548, 822 532, 832 538 C 842 544, 848 528, 858 524" fill="none" stroke="#7d6139" stroke-width="1.8" opacity="0.4"/>
    <!-- gathered folds -->
    <g stroke="#7d6139" stroke-width="1.5" fill="none" opacity="0.24">
      <path d="M774 456 C 756 484, 744 506, 736 528"/>
      <path d="M806 456 C 824 484, 836 506, 844 528"/>
      <path d="M790 460 L790 546" opacity="0.5"/>
    </g>
    <!-- ribbon band at the tie -->
    <path d="M756 452 C 772 444, 808 444, 824 452 C 810 466, 770 466, 756 452 Z" fill="url(#ribbonGrad)"/>
    <!-- satin bow -->
    <g transform="translate(790 450) scale(0.9)">
      <path d="M-4 0 C -22 -20, -48 -22, -52 -6 C -55 8, -34 16, -6 6 Z" fill="url(#ribbonGrad)"/>
      <path d="M4 0 C 22 -20, 48 -22, 52 -6 C 55 8, 34 16, 6 6 Z" fill="url(#ribbonGrad)"/>
      <path d="M-4 0 C -22 -20, -48 -22, -52 -6 C -55 8, -34 16, -6 6 Z" fill="none" stroke="#8e1436" stroke-width="1.4" opacity="0.5"/>
      <path d="M4 0 C 22 -20, 48 -22, 52 -6 C 55 8, 34 16, 6 6 Z" fill="none" stroke="#8e1436" stroke-width="1.4" opacity="0.5"/>
      <ellipse cx="0" cy="1" rx="10" ry="9" fill="#e0577e"/>
      <ellipse cx="-2.5" cy="-2" rx="3.6" ry="2.6" fill="#f290aa" opacity="0.75"/>
      <!-- trailing ribbon tails -->
      <path d="M-7 8 C -11 22, -14 36, -11 47 L-1 47 C -3 34, -2 21, 2 9 Z" fill="#b21c44" opacity="0.9"/>
      <path d="M7 8 C 11 22, 14 36, 11 47 L1 47 C 3 34, 2 21, -2 9 Z" fill="#b21c44" opacity="0.9"/>
    </g>
  </g>

  <!-- ======== ASCII glyph field ======== -->
  <g font-family="'Liberation Mono', 'Courier New', monospace" font-weight="700" fill="#ffffff">
    <text x="40" y="200" font-size="26" opacity="0.26">@</text>
    <text x="92" y="256" font-size="20" opacity="0.18">#</text>
    <text x="1132" y="212" font-size="24" opacity="0.24">@</text>
    <text x="28" y="470" font-size="21" opacity="0.2">#</text>
    <text x="1128" y="486" font-size="23" opacity="0.2">@</text>
    <text x="150" y="582" font-size="18" opacity="0.14">=</text>
    <text x="1024" y="596" font-size="18" opacity="0.14">-</text>
    <text x="380" y="112" font-size="15" opacity="0.13">.</text>
    <text x="960" y="96" font-size="15" opacity="0.13">.</text>
  </g>

  <!-- vignette -->
  <radialGradient id="vig" cx="0.55" cy="0.48" r="0.72" color-interpolation="linearRGB">
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#vig)"/>
</svg>
